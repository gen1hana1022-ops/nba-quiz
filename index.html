<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>各チームの直近10人のオールスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3F5; --ink:#16181D; --ink-soft:#5C616B; --rule:#D5D8DE;
  --slot:#FFFFFF; --slot-empty:#E7E9ED; --good:#1B7F4B; --reveal:#A8302E; --focus:#2B6CB0;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --paper:#14161A; --ink:#EDEFF2; --ink-soft:#9AA1AD; --rule:#2C3037;
    --slot:#1E2128; --slot-empty:#191C21; --good:#4ADE80; --reveal:#F87171; --focus:#7BA7E0;
  }
}
:root[data-theme="dark"]{
  --paper:#14161A; --ink:#EDEFF2; --ink-soft:#9AA1AD; --rule:#2C3037;
  --slot:#1E2128; --slot-empty:#191C21; --good:#4ADE80; --reveal:#F87171; --focus:#7BA7E0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.num{font-family:"Oswald",Impact,sans-serif; font-variant-numeric:tabular-nums; letter-spacing:.02em}

.bar{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--rule); padding:10px 16px 12px}
.bar-inner{max-width:1280px; margin:0 auto; display:flex; flex-wrap:wrap; gap:12px; align-items:center}
h1{font-size:16px; font-weight:700; margin:0; flex:1 1 220px; min-width:0}
h1 small{display:block; font-weight:400; font-size:12px; color:var(--ink-soft)}
.readout{display:flex; gap:18px; align-items:baseline}
.clock{font-size:30px; line-height:1; font-weight:500}
.clock.low{color:var(--reveal)}
.tally{font-size:22px; line-height:1; font-weight:500}
.tally span{font-size:13px; color:var(--ink-soft)}
.controls{display:flex; gap:8px}
button{font:inherit; font-size:13px; font-weight:500; padding:7px 14px; border-radius:2px; cursor:pointer;
  border:1px solid var(--ink); background:transparent; color:var(--ink)}
button:hover{background:var(--ink); color:var(--paper)}
button:focus-visible, input:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
button[disabled]{opacity:.35; cursor:default}
button[disabled]:hover{background:transparent; color:var(--ink)}
.entry{flex:1 1 100%; display:flex; gap:8px; align-items:center}
input[type=text]{flex:1; font:inherit; font-size:17px; padding:10px 14px; border:1px solid var(--rule);
  border-radius:2px; background:var(--slot); color:var(--ink)}
input[type=text]::placeholder{color:var(--ink-soft)}
.hint{font-size:12px; color:var(--ink-soft); white-space:nowrap}

.notice{max-width:1280px; margin:12px auto 0; padding:9px 14px; border:1px dashed var(--rule);
  border-radius:2px; font-size:12px; line-height:1.6; color:var(--ink-soft)}
.notice b{color:var(--ink); font-weight:500}
main{max-width:1280px; margin:0 auto; padding:16px; display:grid;
  grid-template-columns:repeat(4,1fr); gap:14px; align-items:start}
.team{border:1px solid var(--rule); border-radius:2px; overflow:hidden}
.team-head{padding:5px 9px; background:var(--tc,var(--ink)); color:#fff; display:flex; justify-content:space-between; align-items:baseline}
.team-head b{font-size:14px; font-weight:700}
.team-head i{font-style:normal; font-size:10px; opacity:.8}
.row{display:flex; border-top:1px solid var(--rule)}
.team .row:first-of-type{border-top:none}
.yr{flex:0 0 46px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500;
  color:var(--ink-soft); background:var(--slot-empty); border-right:1px solid var(--rule)}
.nm{flex:1; min-width:0; padding:6px 9px; background:var(--slot); font-size:13px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nm:empty::after{content:"\00a0"}
.row.done .nm{color:var(--good); font-weight:500}
.row.shown .nm{color:var(--reveal)}

main.hidden{position:relative; min-height:240px; display:block}
main.hidden .team{display:none}
main.hidden::after{content:"一時停止中 — 「再開」で続きから"; position:absolute; inset:16px;
  display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-soft);
  border:1px dashed var(--rule)}

@media (max-width:1100px){ main{grid-template-columns:repeat(3,1fr)} }
@media (max-width:820px){ main{grid-template-columns:repeat(2,1fr)} h1{flex-basis:100%} .clock{font-size:26px} }
@media (max-width:520px){ main{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){
  .row.done .nm{animation:pop .2s ease-out}
  @keyframes pop{from{transform:translateX(-4px);opacity:.3}to{transform:none;opacity:1}}
}
</style>
</head>

<div class="bar">
  <div class="bar-inner">
    <h1>各チームの直近10人のオールスター<small>2026年まで / 姓のみで解答・ひらがなでも可</small></h1>
    <div class="readout">
      <div class="clock num" id="clock">15:00</div>
      <div class="tally num"><b id="got">0</b><span>/</span><b id="total">0</b></div>
    </div>
    <div class="controls">
      <button id="start">スタート</button>
      <button id="pause" disabled>一時停止</button>
      <button id="giveup" disabled>ギブアップ</button>
    </div>
    <div class="entry">
      <input type="text" id="entry" placeholder="選手の姓を入力（例：よきっち / ヨキッチ）" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
      <span class="hint" id="hint">スタートを押すと入力できます</span>
    </div>
  </div>
</div>

<div class="notice">
  判定基準：所属は<b>オールスター開催時点</b>／<b>欠場者・追加選出者も含む</b>／年は<b>その球団での最後の選出年</b>／
  旧名称・移転前の球団史を含む（例：サンダーはソニックス時代を含む）。
  同じ年に複数の選出者がいる枠は、該当する選手を全員収録しています。
</div>
<main id="board"></main>

 r(2004,"アンドレイ","キリレンコ"), r(2002,"カール","マローン")]),
T("ワシントン・ウィザーズ","WAS","#002B5C",[
 r(2021,"ブラッドリー","ビール"), r(2018,"ジョン","ウォール"), r(2008,"カロン","バトラー"),
 r(2008,"アントワン","ジャミソン"), r(2007,"ギルバート","アリーナス"), r(2003,"マイケル","ジョーダン"),
 r(1997,"クリス","ウェバー"), r(1996,"ジュワン","ハワード"), r(1992,"マイケル","アダムス"),
 r(1991,"バーナード","キング")])
];

/* ---- 表記ゆれの吸収（スタメン版と同じエンジン） ---- */
function norm(s){
  if(!s) return "";
  s = s.normalize("NFKC").trim();
  s = s.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60));
  s = s.replace(/ヴァ/g,"バ").replace(/ヴィ/g,"ビ").replace(/ヴェ/g,"ベ").replace(/ヴォ/g,"ボ").replace(/ヴ/g,"ブ");
  s = s.replace(/[・･\s\u3000\-‐‑–—―−ー]/g,"");
  s = s.replace(/JR\.?$/i,"").replace(/ジュニア$/,"");
  s = s.normalize("NFD").replace(/[\u3099\u309A]/g,"").normalize("NFC");
  const big = {"ァ":"ア","ィ":"イ","ゥ":"ウ","ェ":"エ","ォ":"オ","ャ":"ヤ","ュ":"ユ","ョ":"ヨ","ッ":"ツ","ヮ":"ワ"};
  s = s.replace(/[ァィゥェォャュョッヮ]/g, c => big[c]);
  return s.toUpperCase();
}

const board = document.getElementById("board");
const index = new Map();
let total = 0, got = 0, live = false, ended = false, left = 15*60, tick = null;

DATA.forEach(t => {
  const sec = document.createElement("section");
  sec.className = "team";
  sec.style.setProperty("--tc", t.color);
  const head = document.createElement("div");
  head.className = "team-head";
  head.innerHTML = `<b></b><i></i>`;
  head.querySelector("b").textContent = t.team;
  head.querySelector("i").textContent = t.en;
  sec.appendChild(head);

  t.rows.forEach(row => {
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML = `<div class="yr num"></div><div class="nm"></div>`;
    el.querySelector(".yr").textContent = row.y;
    el.dataset.full = (row.first ? row.first + "・" : "") + row.last;
    sec.appendChild(el);
    total++;
    new Set([norm(row.last), ...(row.alias||[]).map(norm)]).forEach(k => {
      if(!k) return;
      if(!index.has(k)) index.set(k, []);
      index.get(k).push(el);
    });
  });
  board.appendChild(sec);
});
document.getElementById("total").textContent = total;

const entry = document.getElementById("entry");
const hint  = document.getElementById("hint");
let composing = false;

function submit(){
  if(!live) return;
  const key = norm(entry.value);
  if(!key) return;
  const rows = index.get(key);
  if(!rows){ return; }
  entry.value = "";          // 既知の解答なら、埋まったかどうかに関わらず消す
  let hit = 0;
  rows.forEach(el => {
    if(el.classList.contains("done")) return;
    el.classList.add("done");
    el.querySelector(".nm").textContent = el.dataset.full;
    hit++;
  });
  if(hit){
    got += hit;
    document.getElementById("got").textContent = got;
    hint.textContent = hit > 1 ? `同姓 ${hit} マスが埋まりました` : "";
    if(got === total) finish(false);
  }
}
entry.addEventListener("compositionstart", () => composing = true);
entry.addEventListener("compositionend", () => { composing = false; setTimeout(submit, 0); });
entry.addEventListener("input", () => { if(!composing) submit(); });
entry.addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); submit(); } });

function paintClock(){
  const m = Math.floor(left/60), s = left%60;
  const el = document.getElementById("clock");
  el.textContent = m + ":" + String(s).padStart(2,"0");
  el.classList.toggle("low", left <= 60);
}
function runClock(){
  clearInterval(tick);
  tick = setInterval(() => { left--; paintClock(); if(left <= 0) finish(true); }, 1000);
}
function start(){
  if(ended) return;
  live = true;
  entry.disabled = false; entry.focus();
  document.getElementById("start").disabled = true;
  document.getElementById("pause").disabled = false;
  document.getElementById("giveup").disabled = false;
  hint.textContent = "";
  runClock();
}
function togglePause(){
  if(ended) return;
  const btn = document.getElementById("pause");
  if(live){
    live = false; clearInterval(tick);
    entry.disabled = true; board.classList.add("hidden");
    btn.textContent = "再開"; hint.textContent = "";
  } else {
    live = true; board.classList.remove("hidden");
    entry.disabled = false; entry.focus();
    btn.textContent = "一時停止"; runClock();
  }
}
function finish(reveal){
  live = false; ended = true;
  clearInterval(tick);
  entry.disabled = true;
  board.classList.remove("hidden");
  document.getElementById("pause").disabled = true;
  document.getElementById("pause").textContent = "一時停止";
  document.getElementById("giveup").disabled = true;
  if(reveal){
    document.querySelectorAll(".row:not(.done)").forEach(el => {
      el.classList.add("shown");
      el.querySelector(".nm").textContent = el.dataset.full;
    });
  }
  hint.textContent = `終了 — ${got}/${total}（${Math.round(got/total*100)}%）`;
}
document.getElementById("start").addEventListener("click", start);
document.getElementById("pause").addEventListener("click", togglePause);
document.getElementById("giveup").addEventListener("click", () => finish(true));
paintClock();
</script>
